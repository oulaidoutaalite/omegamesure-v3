# Construit l'image de production et la publie sur GHCR.
#
# ⚠️ Pourquoi ici et pas sur le serveur : le Droplet est une machine à 1 vCPU /
# 1 Go, dont il reste ~150 Mo libres. `next build` en demande environ 2 Go — il
# s'y ferait tuer par l'OOM killer. Les runners GitHub offrent 2 vCPU et 7 Go,
# gratuitement sur un dépôt public. Le serveur ne fait plus que TIRER l'image.
#
# L'image est publique, comme le dépôt : le Droplet n'a donc aucun jeton à
# détenir pour la récupérer.

name: Image de production

on:
  push:
    branches: [main]
    # Inutile de reconstruire pour une modification de documentation.
    paths-ignore:
      - '**.md'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Jeton fourni par l'exécution : aucun secret à créer à la main.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Étiquettes
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Construction et publication
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Le Droplet est en amd64 : inutile de construire pour arm.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
